name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the workflow's GITHUB_TOKEN
permissions:
  contents: read

jobs:
  quality:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real, disposable MySQL server for this job, running on GitHub's runner
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: notely_test
          MYSQL_USER: notely
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        # Steps start only after MySQL accepts connections
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # CI doesn't need git hooks
      HUSKY: 0
      NODE_ENV: test
      # 127.0.0.1 instead of localhost: the container port is published on IPv4
      DATABASE_URL: mysql://notely:ci_password@127.0.0.1:3306/notely_test

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall also runs `prisma generate`
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Apply database migrations
        run: npm run db:deploy

      # Fails if schema.prisma was changed without creating a migration
      - name: Check schema matches migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
